name: Build & Deploy to siteasp.net

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # permite lanzarlo manualmente desde GitHub

jobs:
  build-and-deploy:
    runs-on: windows-latest   # WebDeploy requiere Windows

    steps:
      # 1. Checkout del código
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Instalar .NET 10
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 3. Restaurar dependencias
      - name: Restore
        run: dotnet restore PurchaseTracker.Web/PurchaseTracker.Web.csproj

      # 4. Build en Release
      - name: Build
        run: dotnet build PurchaseTracker.Web/PurchaseTracker.Web.csproj -c Release --no-restore

      # 5. Publish → carpeta local
      - name: Publish
        run: dotnet publish PurchaseTracker.Web/PurchaseTracker.Web.csproj -c Release --no-build -o ./publish-output

      # 6. Deploy via Web Deploy (MSDeploy) a siteasp.net
      - name: Deploy via Web Deploy
        env:
          DEPLOY_PASSWORD: ${{ secrets.WEBDEPLOY_PASSWORD }}
        shell: pwsh
        run: |
          $msdeploy  = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          $publishPath = (Resolve-Path ./publish-output).Path
          $password    = $env:DEPLOY_PASSWORD
          $computerName = "https://site60072.siteasp.net:8172/msdeploy.axd?site=site60072"

          # Cada elemento del array es un argumento separado — sin backtick ni comas en líneas distintas
          $arguments = @(
            "-verb:sync",
            "-source:contentPath=$publishPath",
            "-dest:contentPath=site60072,computerName=$computerName,userName=site60072,password=$password,authType=Basic",
            "-allowUntrusted",
            "-enableRule:AppOffline"
          )

          & $msdeploy @arguments
          exit $LASTEXITCODE
