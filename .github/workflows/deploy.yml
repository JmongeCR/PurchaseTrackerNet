name: Build & Deploy to siteasp.net

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # permite lanzarlo manualmente desde GitHub

jobs:
  build-and-deploy:
    runs-on: windows-latest   # WebDeploy requiere Windows

    steps:
      # 1. Checkout del código
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Instalar .NET 10
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 3. Restaurar dependencias
      - name: Restore
        run: dotnet restore PurchaseTracker.Web/PurchaseTracker.Web.csproj

      # 4. Build en Release
      - name: Build
        run: dotnet build PurchaseTracker.Web/PurchaseTracker.Web.csproj -c Release --no-restore

      # 5. Publish + Deploy directo al servidor via el perfil .pubxml
      - name: Publish & Deploy
        env:
          DEPLOY_PASSWORD: ${{ secrets.WEBDEPLOY_PASSWORD }}
        shell: pwsh
        run: |
          dotnet publish PurchaseTracker.Web/PurchaseTracker.Web.csproj `
            -c Release `
            --no-build `
            /p:PublishProfile=site60072-WebDeploy `
            /p:Password="$env:DEPLOY_PASSWORD" `
            /p:AllowUntrustedCertificate=true
